name: Build with ZDE

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      romdisk:
        required: false
        type: boolean
        default: true

jobs:
  build-zos:
    runs-on: ubuntu-latest
    env:
      ZDE_DIR: zeal-dev-environment
      ZDE_PATH: ${{ github.workspace }}/zeal-dev-environment

    services:
      docker:
        image: docker:latest
        options: --privileged

    steps:
      - name: Set up prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            git \
            python3 \
            python3-pip

      - name: Setup ZDE
        uses: zoul0813/zeal-dev-environment/github/setup-zde@main

      - name: Checkout Zeal 8-bit OS
        uses: actions/checkout@v6
        with:
          path: ${{ env.ZDE_DIR }}/home/Zeal-8-bit-OS

      - name: Build OS for ${{ inputs.target }}
        run: |
          zde kernel "${{ inputs.target }}"

      - name: Verify build artifacts
        run: |
          cd "${ZDE_PATH}/home/Zeal-8-bit-OS"

          if [ -f "build/os.bin" ]; then
            echo "✓ OS binary created"
            ls -lh build/os.bin
          else
            echo "✗ OS binary not found"
            exit 1
          fi

          if [ -f "build/os_with_romdisk.img" ]; then
            echo "✓ OS with romdisk created"
            ls -lh build/os_with_romdisk.img
          else
            echo "⚠ OS with romdisk not found (optional)"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ${{ env.ZDE_PATH }}/home/Zeal-8-bit-OS/build/os.bin
            ${{ env.ZDE_PATH }}/home/Zeal-8-bit-OS/build/os.map
            ${{ inputs.romdisk && format('{0}/home/Zeal-8-bit-OS/build/os_with_romdisk.img', env.ZDE_PATH) || '' }}
            ${{ env.ZDE_PATH }}/home/Zeal-8-bit-OS/build/os.conf
          retention-days: 60
